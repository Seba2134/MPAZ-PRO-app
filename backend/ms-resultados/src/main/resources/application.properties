spring.application.name=ms-resultados
server.port=8082

# Base de datos H2 propia en un archivo: los datos sobreviven al reiniciar el servidor
spring.datasource.url=jdbc:h2:file:./data/resultados
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# La MISMA clave de ms-usuarios: aquí solo se usa para validar los JWT (este servicio no los genera).
# Solo de desarrollo: en un caso real va en una variable de entorno.
mpazpro.jwt.secreto=mpazpro-clave-de-desarrollo-2026-no-usar-en-produccion
