spring.application.name=ms-usuarios
server.port=8081

# Base de datos H2 propia en un archivo: los datos sobreviven al reiniciar el servidor
spring.datasource.url=jdbc:h2:file:./data/usuarios
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# Clave para firmar los JWT (HS256, mínimo 32 caracteres). ms-resultados usa la MISMA clave para validarlos.
# Solo de desarrollo: en un caso real va en una variable de entorno.
mpazpro.jwt.secreto=mpazpro-clave-de-desarrollo-2026-no-usar-en-produccion
mpazpro.jwt.horas=8
